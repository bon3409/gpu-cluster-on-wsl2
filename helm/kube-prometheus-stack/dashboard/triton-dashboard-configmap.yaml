                  "options": {
                    "content": "This dashboard monitors Triton model serving using the Prometheus metrics exposed by Triton.\n\n**Key concepts**\n- `nv_inference_request_success`: successful client requests\n- `nv_inference_count`: individual inferences, including work performed inside batches\n- `nv_inference_exec_count`: backend model executions\n- Average batch size ≈ `inference_count / exec_count`\n- Latency counters are cumulative microseconds, so panels use `rate()` and convert to milliseconds\n- GPU utilization and memory are instantaneous gauges",
                    "mode": "markdown"
                  },
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  }
