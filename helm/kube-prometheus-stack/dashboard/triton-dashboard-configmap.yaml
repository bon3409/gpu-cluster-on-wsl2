                  "options": {
                    "content": "- **GPU power / energy:** your supplied metrics currently report `nv_gpu_power_usage=0`, `nv_gpu_power_limit=0`, and `nv_energy_consumption=0`. The dashboard intentionally does not treat these zeros as meaningful power telemetry.\n- **Percentiles:** the supplied metrics are cumulative counters/gauges. This dashboard therefore shows rate-derived averages. If you enable Triton's optional latency histograms, you can add P95/P99 panels from histogram series.\n- **Dynamic batching:** average effective batch size is estimated as `rate(nv_inference_count) / rate(nv_inference_exec_count)`. A value near 1 means little/no server-side batching; values closer to 4 or 8 indicate more batching for your ResNet50 configuration.\n- **Counters:** cumulative totals are retained for the lifetime of the Triton process and reset when Triton restarts.",
